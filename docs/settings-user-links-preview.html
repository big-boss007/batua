<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — User Facing Links Section</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fa;
    color: #1a1a2e;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }
  .design-label {
    text-align: center;
    color: #9ca3af;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 24px;
    font-weight: 500;
  }
  .container {
    max-width: 520px;
    margin: 0 auto;
  }

  /* Existing fields above (context) */
  .context-fields {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
    opacity: 0.4;
  }
  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 4px;
  }
  .field-value {
    padding: 10px 14px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 14px;
    color: #1a1a2e;
    width: 280px;
  }
  .pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: #ede9fe;
    color: #6366f1;
    text-transform: capitalize;
  }
  .storefront-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .storefront-code {
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    padding: 8px 14px;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    color: #1a1a2e;
  }
  .copy-btn {
    font-size: 12px;
    color: #6366f1;
    background: none;
    border: 1px solid #6366f1;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  /* === USER FACING LINKS SECTION === */
  .section-divider {
    height: 1px;
    background: #e5e7eb;
    margin: 8px 0 24px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 6px;
  }

  .section-subtitle {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 20px;
  }

  .links-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    transition: border-color 0.2s;
  }

  .link-row:hover {
    border-color: #c7d2fe;
  }

  .link-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .link-icon.rewards { background: #ede9fe; }
  .link-icon.gift-card { background: #fef3c7; }
  .link-icon.referral { background: #d1fae5; }

  .link-name {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a2e;
  }

  .link-path {
    font-size: 12px;
    color: #9ca3af;
    font-family: 'SF Mono', monospace;
    margin-top: 2px;
  }

  .link-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .link-btn {
    font-size: 11px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #ffffff;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.2s;
  }

  .link-btn:hover {
    border-color: #6366f1;
    color: #6366f1;
  }

  .link-btn.open {
    background: #6366f1;
    color: #ffffff;
    border-color: #6366f1;
  }

  .link-btn.open:hover {
    background: #4f46e5;
  }

  /* Save button context */
  .save-row {
    margin-top: 24px;
    opacity: 0.4;
  }
  .save-btn {
    padding: 10px 24px;
    background: #6366f1;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }

  @media print {
    body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
  @page { size: A4; margin: 15mm; }
</style>
</head>
<body>

<div class="design-label">Settings — My Store tab with User Facing Links</div>

<div class="container">
  <!-- Existing fields (dimmed for context) -->
  <div class="context-fields">
    <div>
      <div class="field-label">Storefront URL</div>
      <div class="storefront-row">
        <div class="storefront-code">/s/desidrapes</div>
        <button class="copy-btn">Copy</button>
      </div>
    </div>
  </div>

  <!-- NEW: User Facing Links -->
  <div class="section-divider"></div>

  <div class="section-title">Customer Links</div>
  <div class="section-subtitle">Share these links with your customers</div>

  <div class="links-grid">
    <div class="link-row">
      <div class="link-left">
        <div class="link-icon rewards">💰</div>
        <div>
          <div class="link-name">Rewards Hub</div>
          <div class="link-path">/s/desidrapes</div>
        </div>
      </div>
      <div class="link-actions">
        <button class="link-btn">Copy</button>
        <button class="link-btn open">Open</button>
      </div>
    </div>

    <div class="link-row">
      <div class="link-left">
        <div class="link-icon gift-card">🎁</div>
        <div>
          <div class="link-name">Gift Card Check</div>
          <div class="link-path">/s/desidrapes/gift-cards/check</div>
        </div>
      </div>
      <div class="link-actions">
        <button class="link-btn">Copy</button>
        <button class="link-btn open">Open</button>
      </div>
    </div>

    <div class="link-row">
      <div class="link-left">
        <div class="link-icon referral">🔗</div>
        <div>
          <div class="link-name">Referral Program</div>
          <div class="link-path">/s/desidrapes/refer</div>
        </div>
      </div>
      <div class="link-actions">
        <button class="link-btn">Copy</button>
        <button class="link-btn open">Open</button>
      </div>
    </div>
  </div>

  <div class="save-row">
    <button class="save-btn">Save Changes</button>
  </div>
</div>

</body>
</html>
